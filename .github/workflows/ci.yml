name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_JWKS_URL: https://example.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m mypy app
      - run: python -m pytest

  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Iniciar y migrar Supabase local
        run: |
          supabase start
          supabase db reset --local
      - name: Exportar credenciales locales efímeras
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_JWKS_URL=$API_URL/auth/v1/.well-known/jwks.json" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "TEST_API_BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "CYPRESS_BASE_URL=http://localhost:3000" >> "$GITHUB_ENV"
      - name: Instalar backend
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Instalar frontend
        working-directory: frontend
        run: npm ci
      - name: Verificar tipos E2E
        working-directory: frontend
        run: npm run e2e:typecheck
      - name: Compilar frontend
        working-directory: frontend
        run: npm run build
      - name: Iniciar FastAPI
        working-directory: backend
        run: |
          PYTHONPATH=. nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > e2e-api.log 2>&1 &
      - name: Ejecutar integración real
        working-directory: backend
        env:
          RUN_LOCAL_WORKFLOW_TESTS: "1"
        run: |
          timeout 60 bash -c 'until curl --fail --silent http://127.0.0.1:8000/api/v1/health; do sleep 1; done'
          python -m pytest --no-cov tests/integration/test_local_workflow.py
      - name: Ejecutar Cypress
        uses: cypress-io/github-action@v7
        with:
          command: npm run e2e:run -- --browser chrome
          install: false
          start: npm start -- --hostname 127.0.0.1
          wait-on: http://localhost:3000/login,http://127.0.0.1:8000/api/v1/health
          wait-on-timeout: 120
          working-directory: frontend
      - name: Guardar evidencia de fallos E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidence
          if-no-files-found: ignore
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
            backend/e2e-api.log
      - name: Detener Supabase local
        if: always()
        run: supabase stop --no-backup
